name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-governance:
    name: Protobuf contract governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.73.0
      - run: cargo install protoc-gen-prost --version 0.5.0 --locked
      - name: Buf lint
        working-directory: contracts
        run: buf lint
      - name: Buf breaking check against checked-in baseline
        working-directory: contracts
        run: buf breaking proto --against baseline
      - name: Verify generated Rust is current
        working-directory: contracts
        run: |
          buf generate
          git -C .. diff --exit-code -- modules/example-transport/src/generated
          test -z "$(git -C .. ls-files --others --exclude-standard -- modules/example-transport/src/generated)"
      - name: Enforce transport boundary
        run: python3 scripts/check_transport_boundary.py

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check

  check:
    name: Workspace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --locked

  build:
    name: Workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace --locked

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    env:
      BC_TEST_ADMIN_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  local-compose-reconciliation:
    name: Local Compose reconciliation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run real local Compose reconciliation smoke
        run: python3 scripts/compose_smoke.py

  m0-proof:
    name: M0 architecture proof
    if: ${{ always() }}
    needs:
      - contract-governance
      - format
      - check
      - build
      - test
      - clippy
      - local-compose-reconciliation
    runs-on: ubuntu-latest
    steps:
      - name: Require every M0 gate to succeed
        env:
          CONTRACT_GOVERNANCE_RESULT: ${{ needs.contract-governance.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          COMPOSE_RESULT: ${{ needs.local-compose-reconciliation.result }}
        run: |
          for result in \
            "$CONTRACT_GOVERNANCE_RESULT" \
            "$FORMAT_RESULT" \
            "$CHECK_RESULT" \
            "$BUILD_RESULT" \
            "$TEST_RESULT" \
            "$CLIPPY_RESULT" \
            "$COMPOSE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "M0 architecture proof failed: required gate result was $result" >&2
              exit 1
            fi
          done
          echo "M0 architecture proof passed"

  frontend:
    name: Production frontends and live browser boundary
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    env:
      BC_TEST_ADMIN_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/postgres
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            frontend/storefront/package-lock.json
            frontend/admin/package-lock.json
            frontend/e2e/package-lock.json
      - run: npm install --global npm@11.18.0
      - name: Storefront pinned install, typecheck, arithmetic tests and build
        run: |
          npm ci --prefix frontend/storefront
          npm run typecheck --prefix frontend/storefront
          npm run test --prefix frontend/storefront
          npm run build --prefix frontend/storefront
      - name: Admin pinned install, typecheck, arithmetic tests and build
        run: |
          npm ci --prefix frontend/admin
          npm run typecheck --prefix frontend/admin
          npm run test --prefix frontend/admin
          npm run build --prefix frontend/admin
      - name: Live production browser check against Rust and PostgreSQL
        run: |
          npm ci --prefix frontend/e2e
          npx --prefix frontend/e2e playwright install --with-deps chromium
          cargo test -p better-commerce-core --test browser_live --locked -- --ignored --nocapture
