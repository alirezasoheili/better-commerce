name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-governance:
    name: Protobuf contract governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.73.0
      - run: cargo install protoc-gen-prost --version 0.5.0 --locked
      - name: Buf lint
        working-directory: contracts
        run: buf lint
      - name: Buf breaking check against checked-in baseline
        working-directory: contracts
        run: buf breaking proto --against baseline
      - name: Verify generated Rust is current
        working-directory: contracts
        run: |
          buf generate
          git -C .. diff --exit-code -- modules/example-transport/src/generated
          test -z "$(git -C .. ls-files --others --exclude-standard -- modules/example-transport/src/generated)"
      - name: Enforce transport boundary
        run: python3 scripts/check_transport_boundary.py

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check

  check:
    name: Workspace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --locked

  build:
    name: Workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace --locked

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    env:
      BC_TEST_ADMIN_DATABASE_URL: postgres://postgres:test_only_password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
