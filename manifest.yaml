release: 0.1.0
deployment_mode: self_hosted
modules:
  example:
    version: 0.1.0
    configuration:
      label: Example
local:
  installation_id: example-local
  database_name: bc_example_local
  http_port: 3000
  secrets:
    operations_password:
      env: BC_OPERATIONS_PASSWORD
    example_password:
      env: BC_EXAMPLE_PASSWORD
    dispatcher_password:
      env: BC_DISPATCHER_PASSWORD
    readiness_password:
      env: BC_READINESS_PASSWORD
